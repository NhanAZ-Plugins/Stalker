---
# {sender} : Name of user who used command
# {command} : Command used by user
message: "<{sender}> /{command}"

# Commands to redact from staff messages and log files, without a leading slash.
# Login and register are always redacted. Add authentication aliases and other
# commands that may contain private arguments, for example ["l", "reg", "tell"].
exceptionCmds: []

# Choose the log file using the server date at plugin startup.
perDayFile: false
...
